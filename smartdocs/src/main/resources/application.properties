# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/smartdocs
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# File Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- CHAT MODEL (Groq) ---
langchain4j.open-ai.chat-model.api-key=YOUR_GROQ_KEY_HERE
langchain4j.open-ai.chat-model.model-name=openai/gpt-oss-120b
langchain4j.open-ai.chat-model.base-url=https://api.groq.com/openai/v1

# --- EMBEDDING MODEL (Google Gemini) ---
# Paste the key that starts with AQ. here
langchain4j.google-ai-gemini.api-key=YOUR_GEMINI_KEY_HERE 